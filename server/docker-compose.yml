# Values in .env are generated by churn
services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8096:8096"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ./config/jellyfin:/config
      - ./cache/jellyfin:/cache
      - "${DATA_DIR:?run churn to set DATA_DIR}:/data"
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls1
    container_name: sonarr
    ports:
      - "8989:8989"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ./config/sonarr:/config
      - "${DATA_DIR:?run churn to set DATA_DIR}:/data"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls324
    container_name: radarr
    ports:
      - "7878:7878"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ./config/radarr:/config
      - "${DATA_DIR:?run churn to set DATA_DIR}:/data"
    restart: unless-stopped
