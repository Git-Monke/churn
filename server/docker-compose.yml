# Values in .env are generated by churn
services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ./config/jellyfin:/config
      - ./cache/jellyfin:/cache
      - "${DOWNLOAD_DIR:-${DATA_DIR:?run churn to set DOWNLOAD_DIR}}:/data"
      - "${MEDIA_DIR:-${DOWNLOAD_DIR:-${DATA_DIR:?run churn to set MEDIA_DIR}}/media}:/data/media"
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls1
    ports:
      - "${SONARR_PORT:-8989}:8989"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ./config/sonarr:/config
      - "${DOWNLOAD_DIR:-${DATA_DIR:?run churn to set DOWNLOAD_DIR}}:/data"
      - "${MEDIA_DIR:-${DOWNLOAD_DIR:-${DATA_DIR:?run churn to set MEDIA_DIR}}/media}:/data/media"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls324
    ports:
      - "${RADARR_PORT:-7878}:7878"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ./config/radarr:/config
      - "${DOWNLOAD_DIR:-${DATA_DIR:?run churn to set DOWNLOAD_DIR}}:/data"
      - "${MEDIA_DIR:-${DOWNLOAD_DIR:-${DATA_DIR:?run churn to set MEDIA_DIR}}/media}:/data/media"
    restart: unless-stopped

  # One-shot: creates the shared media folders and registers them as the
  # Sonarr/Radarr root folders.
  server-init:
    image: curlimages/curl:8.23.0
    user: "0:0"
    entrypoint: ["/bin/sh", "/server-init.sh"]
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - SONARR_URL=http://sonarr:8989
      - RADARR_URL=http://radarr:7878
    depends_on:
      sonarr:
        condition: service_started
      radarr:
        condition: service_started
    volumes:
      - ./scripts/server-init.sh:/server-init.sh:ro
      - ./config/sonarr:/sonarr-config:ro
      - ./config/radarr:/radarr-config:ro
      - "${DOWNLOAD_DIR:-${DATA_DIR:?run churn to set DOWNLOAD_DIR}}:/data"
      - "${MEDIA_DIR:-${DOWNLOAD_DIR:-${DATA_DIR:?run churn to set MEDIA_DIR}}/media}:/data/media"
    restart: "no"

  # One-shot: the dashboard runs as PUID:PGID, but a fresh named volume
  # inherits the image's directory ownership (node, uid 1000). Hand both
  # volumes to the runtime identity so the release cache and the auth state are
  # writable; otherwise the backend falls back to /tmp and loses them on every
  # restart.
  cache-init:
    image: ${CHURN_DASHBOARD_IMAGE:-ghcr.io/git-monke/churn-dashboard:latest}
    user: "0:0"
    cap_add: [CHOWN]
    security_opt:
      - no-new-privileges:true
    read_only: true
    entrypoint:
      - /bin/sh
      - -c
      - 'chown -R "${PUID:-1000}:${PGID:-1000}" /app/.churn-cache /app/state || echo "churn: cannot take ownership of the cache volumes; the dashboard will cache in /tmp" >&2'
    volumes:
      - churn-cache:/app/.churn-cache
      - churn-state:/app/state
    restart: "no"

  # Web dashboard. The image is built by CI and pinned in .env by the
  # installer. Host networking keeps every upstream on 127.0.0.1 (including
  # the loopback-only VPN status agent) and lets the backend discover the
  # host's LAN address for browser-facing Jellyfin streams.
  dashboard:
    # The installer pins CHURN_DASHBOARD_IMAGE to the matching release tag.
    # `latest` is only a safety net for older installs (for example a compose
    # down during uninstall); normal starts always use the pinned tag.
    image: ${CHURN_DASHBOARD_IMAGE:-ghcr.io/git-monke/churn-dashboard:latest}
    network_mode: host
    init: true
    # The dashboard reads server/.env, which churn writes root:${PGID} 0640.
    # Run it as the same identity derived from the media directories.
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pull_policy: missing
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=${DASHBOARD_PORT:-4000}
      - CHURN_SERVER_DIR=/app
      - CHURN_STATE_DIR=/app/state
      - JELLYFIN_URL=http://127.0.0.1:${JELLYFIN_PORT:-8096}
      - SONARR_URL=http://127.0.0.1:${SONARR_PORT:-8989}
      - RADARR_URL=http://127.0.0.1:${RADARR_PORT:-7878}
      - QBITTORRENT_URL=http://127.0.0.1:${QBITTORRENT_PORT:-8080}
      - PROWLARR_URL=http://127.0.0.1:${PROWLARR_PORT:-9696}
      - VPN_STATUS_URL=http://127.0.0.1:${VPN_STATUS_PORT:-8098}
    volumes:
      - ./.env:/app/.env:ro
      - ./config:/app/config:ro
      - ../torrent/config/prowlarr:/torrent/config/prowlarr:ro
      - ../torrent/config/qbittorrent:/torrent/config/qbittorrent:ro
      - churn-cache:/app/.churn-cache
      - churn-state:/app/state
    depends_on:
      cache-init:
        condition: service_completed_successfully
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  churn-cache:
  churn-state:
