name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  binaries:
    name: churn (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Check release tag matches the Cargo version
        run: scripts/check-version.sh "$GITHUB_REF_NAME"

      - uses: taiki-e/install-action@v2
        with:
          tool: cross

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build static binary
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Package and checksum
        run: |
          mkdir -p dist
          asset="churn-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/churn" "dist/$asset"
          (cd dist && sha256sum "$asset" > "$asset.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: churn-${{ matrix.target }}
          path: dist/*

  publish:
    name: Publish release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release tag matches the Cargo version
        run: scripts/check-version.sh "$GITHUB_REF_NAME"

      # The churn binary pins <repo>:<CARGO_PKG_VERSION>. Never publish a
      # release whose matching image is missing or not anonymously pullable,
      # otherwise a fresh install cannot start the dashboard.
      - name: Verify the dashboard image is published and public
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          image="ghcr.io/git-monke/churn-dashboard:$version"
          for _ in $(seq 1 60); do
            if docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "found $image"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$image is missing or not public; publish the image first"
          exit 1

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
