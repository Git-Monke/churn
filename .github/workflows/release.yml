name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # A tag can be pushed by hand, or a release can be re-run. The static layer of
  # the VPN gate runs here too, so no release can publish while the shipped
  # compose file fails the isolation rules. The live layer needs a real tun
  # device and WireGuard credentials, so it stays in scripts/release.sh.
  #
  # Deliberately NOT change-detected, unlike ci.yml: a release is the moment the
  # promise is made, it needs no tun device, and it takes about a minute.
  vpn-gate:
    name: VPN config gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Shipped compose file is isolated
        run: cargo run --locked --quiet -- verify-vpn --env-file tests/vpn-gate/fixture.env

      - name: Known unsafe layouts are rejected
        run: cargo test --locked --test compose_gate

  binaries:
    name: churn (${{ matrix.target }})
    # The VPN gate runs first, so a release whose compose file fails the
    # isolation rules produces no build artifact at all.
    needs: vpn-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Check release tag matches the Cargo version
        run: scripts/check-version.sh "$GITHUB_REF_NAME"

      - uses: taiki-e/install-action@v2
        with:
          tool: cross

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build static binary
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Package and checksum
        run: |
          mkdir -p dist
          asset="churn-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/churn" "dist/$asset"
          (cd dist && sha256sum "$asset" > "$asset.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: churn-${{ matrix.target }}
          path: dist/*

  publish:
    name: Publish release
    needs: [binaries, vpn-gate]
    # `binaries` already depends on `vpn-gate`, but listing both keeps the
    # security precondition visible at the job that actually publishes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release tag matches the Cargo version
        run: scripts/check-version.sh "$GITHUB_REF_NAME"

      # The churn binary pins <repo>:<CARGO_PKG_VERSION>. Never publish a
      # release whose matching image is missing or not anonymously pullable,
      # otherwise a fresh install cannot start the dashboard.
      - name: Verify the dashboard image is published and public
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          image="ghcr.io/git-monke/churn-dashboard:$version"
          for _ in $(seq 1 60); do
            if docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "found $image"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$image is missing or not public; publish the image first"
          exit 1

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
