# Values in .env are generated by churn
services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${QBITTORRENT_PORT:-8080}:8080" # qBittorrent web UI (published here, not on qbittorrent)
      - "${PROWLARR_PORT:-9696}:9696"    # Prowlarr web UI (published here, not on prowlarr)
      - "127.0.0.1:${VPN_STATUS_PORT:-8098}:${VPN_STATUS_PORT:-8098}"  # dashboard VPN check, loopback only
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      # Kill switch: block all egress except the tunnel. The only non-VPN
      # exception is this host's LAN address, needed for Sonarr/Radarr.
      - FIREWALL_ENABLED_DISABLING_IT_SHOOTS_YOU_IN_YOUR_FOOT=on
      - FIREWALL_OUTBOUND_SUBNETS=${HOST_IP:-127.0.0.1}/32
      # DNS is answered by Gluetun's local resolver (127.0.0.1) over DoT.
      # Never fall back to the host/Docker nameserver; that would leak DNS.
      - DNS_SERVER=on
      - DNS_ADDRESS=127.0.0.1
      - DNS_KEEP_NAMESERVER=off
      - DNS_UPSTREAM_RESOLVER_TYPE=dot
      - HEALTH_RESTART_VPN=on
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:?run churn first}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES:?run churn first}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-}
      - TZ=${TZ:-UTC}
    # The config parser only accepts an IPv4 tunnel address, so disable IPv6
    # in the shared namespace rather than risk an un-tunnelled IPv6 route.
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
      net.ipv6.conf.default.disable_ipv6: 1
    restart: unless-stopped

  # Fail-closed startup gate. It shares Gluetun's network namespace and proves
  # that egress is a Mullvad exit, direct eth0 egress is blocked, and DNS uses
  # Gluetun's local resolver. qBittorrent, Prowlarr and FlareSolverr wait for it.
  vpn-check:
    image: curlimages/curl:8.23.0
    network_mode: "service:gluetun"
    user: "0:0"
    environment:
      - HOST_IP=${HOST_IP:-}
      - TZ=${TZ:-UTC}
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - ./resolv.conf:/etc/resolv.conf:ro    # Gluetun's local DNS
      - ./scripts/vpn-lib.sh:/scripts/vpn-lib.sh:ro
      - ./scripts/vpn-check.sh:/scripts/vpn-check.sh:ro
    entrypoint: ["/bin/sh", "/scripts/vpn-check.sh"]
    restart: "no"

  # On-demand leak test for the dashboard. Shares Gluetun's namespace, so the
  # checks run from the same network namespace as qBittorrent. Its port is
  # published on the host loopback only; the churn backend is the only client.
  vpn-status:
    image: curlimages/curl:8.23.0
    network_mode: "service:gluetun"
    user: "0:0"
    environment:
      - HOST_IP=${HOST_IP:-}
      - TZ=${TZ:-UTC}
      - VPN_STATUS_PORT=${VPN_STATUS_PORT:-8098}
      - QBITTORRENT_URL=http://127.0.0.1:8080
      - PROWLARR_URL=http://127.0.0.1:9696
      - FLARESOLVERR_URL=${FLARESOLVERR_URL:-http://localhost:8191}
    depends_on:
      gluetun:
        condition: service_healthy
      vpn-check:
        condition: service_completed_successfully
    volumes:
      - ./resolv.conf:/etc/resolv.conf:ro    # Gluetun's local DNS
      - ./scripts/vpn-lib.sh:/scripts/vpn-lib.sh:ro
      - ./scripts/vpn-status.sh:/scripts/vpn-status.sh:ro
    entrypoint: ["/bin/sh", "/scripts/vpn-status.sh", "serve"]
    restart: unless-stopped

  # Bypasses Cloudflare/DDoS-GUARD challenges for indexers such as EZTV.
  # Shares Gluetun's network namespace so browser traffic also exits the VPN.
  flaresolverr:
    image: flaresolverr/flaresolverr:v3.5.2
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
      vpn-check:
        condition: service_completed_successfully
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-UTC}
    volumes:
      - ./resolv.conf:/etc/resolv.conf:ro    # Gluetun's local DNS
    tmpfs:
      - /tmp:size=256M,mode=1777       # Chromium profiles stay in RAM
    restart: unless-stopped

  # One-shot: seeds qBittorrent's config with a stable API key before it starts.
  qbittorrent-init:
    image: curlimages/curl:8.23.0
    network_mode: "none"                # writes config only; no network at all
    user: "0:0"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config/qbittorrent:/config
      - ./scripts/qbittorrent-init.sh:/scripts/qbittorrent-init.sh:ro
    entrypoint: ["/bin/sh", "/scripts/qbittorrent-init.sh"]
    restart: "no"

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.3.0_v2.1.2-ls485
    network_mode: "service:gluetun"      # all traffic exits through the VPN; kill switch included
    depends_on:
      gluetun:
        condition: service_healthy       # gluetun's image ships a healthcheck
      vpn-check:
        condition: service_completed_successfully
      qbittorrent-init:
        condition: service_completed_successfully
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      - "${DOWNLOAD_DIR:-${DATA_DIR:?run churn to set DOWNLOAD_DIR}}:/data"
      - "${MEDIA_DIR:-${DOWNLOAD_DIR:-${DATA_DIR:?run churn to set MEDIA_DIR}}/media}:/data/media"
      - ./resolv.conf:/etc/resolv.conf:ro    # Gluetun's local DNS
    restart: unless-stopped

  # Gluetun can restart its tunnel in place. The sidecars then keep the same
  # namespace, but qBittorrent keeps the libtorrent session it built on the old
  # exit, so DHT drops to zero nodes and every download stalls at 0%. This
  # watcher notices the reconnect (or a stuck DHT) and restarts qBittorrent
  # through its own API; s6 brings qbittorrent-nox back inside the container,
  # so no Docker socket is needed. See scripts/qbit-watch.sh.
  qbit-watch:
    image: curlimages/curl:8.23.0
    network_mode: "service:gluetun"      # same namespace and API path as qBittorrent
    # Same owner as qBittorrent's config tree, so the API key stays readable
    # without widening the file modes.
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      gluetun:
        condition: service_healthy
      vpn-check:
        condition: service_completed_successfully
      qbittorrent-init:
        condition: service_completed_successfully
      qbittorrent:
        condition: service_started
    environment:
      - TZ=${TZ:-UTC}
      - QBITTORRENT_URL=http://127.0.0.1:8080
      - GLUETUN_CONTROL_URL=http://127.0.0.1:8000
      - QBIT_WATCH_INTERVAL_SECONDS=${QBIT_WATCH_INTERVAL_SECONDS:-5}
      - QBIT_WATCH_DHT_STALL_SECONDS=${QBIT_WATCH_DHT_STALL_SECONDS:-30}
    volumes:
      - ./config/qbittorrent:/qbittorrent-config:ro    # API key only
      - ./resolv.conf:/etc/resolv.conf:ro    # Gluetun's local DNS
      - ./scripts/qbit-watch.sh:/scripts/qbit-watch.sh:ro
    entrypoint: ["/bin/sh", "/scripts/qbit-watch.sh"]
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.7.0.5723-ls166
    network_mode: "service:gluetun"      # indexer traffic also exits through the VPN
    depends_on:
      gluetun:
        condition: service_healthy
      vpn-check:
        condition: service_completed_successfully
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ./config/prowlarr:/config
      - "${DOWNLOAD_DIR:-${DATA_DIR:?run churn to set DOWNLOAD_DIR}}:/data"
      - ./resolv.conf:/etc/resolv.conf:ro    # Gluetun's local DNS
    restart: unless-stopped

  # One-shot: wires qBittorrent, public indexers, and Sonarr/Radarr.
  prowlarr-init:
    image: curlimages/curl:8.23.0
    network_mode: "service:gluetun"      # localhost reaches Prowlarr and qBittorrent
    user: "0:0"
    environment:
      - HOST_IP=${HOST_IP:-}
      - QBITTORRENT_PORT=${QBITTORRENT_PORT:-8080}
      - SONARR_URL=http://${HOST_IP}:${SONARR_PORT:-8989}
      - RADARR_URL=http://${HOST_IP}:${RADARR_PORT:-7878}
      - FLARESOLVERR_URL=${FLARESOLVERR_URL:-http://localhost:8191}
      - PROWLARR_INDEXERS=${PROWLARR_INDEXERS:-eztv,yts,thepiratebay,1337x,limetorrents,torrentdownloads,uindex}
    depends_on:
      gluetun:
        condition: service_healthy
      vpn-check:
        condition: service_completed_successfully
      flaresolverr:
        condition: service_started
      qbittorrent-init:
        condition: service_completed_successfully
      qbittorrent:
        condition: service_started
      prowlarr:
        condition: service_started
    volumes:
      - ./config/prowlarr:/prowlarr-config:ro
      - ./config/qbittorrent:/qbittorrent-config:ro
      # Same-machine wiring: the server stack writes Sonarr/Radarr API keys here.
      - ../server/config/sonarr:/sonarr-config:ro
      - ../server/config/radarr:/radarr-config:ro
      - ./resolv.conf:/etc/resolv.conf:ro    # Gluetun's local DNS
      - ./scripts/prowlarr-init.sh:/scripts/prowlarr-init.sh:ro
    entrypoint: ["/bin/sh", "/scripts/prowlarr-init.sh"]
    restart: "no"
