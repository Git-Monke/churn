# Values in .env are generated by ../install.py
services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8080:8080"                      # qBittorrent web UI (published here, not on qbittorrent)
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:?run ../install.py first}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES:?run ../install.py first}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-}
      - TZ=${TZ:-UTC}
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.3.0_v2.1.2-ls485
    container_name: qbittorrent
    network_mode: "service:gluetun"      # all traffic exits through the VPN; kill switch included
    depends_on:
      gluetun:
        condition: service_healthy       # gluetun's image ships a healthcheck
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      - "${DATA_DIR:?run ../install.py to set DATA_DIR}:/data"
    restart: unless-stopped
