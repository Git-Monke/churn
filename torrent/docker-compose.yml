# Values in .env are generated by churn
services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8080:8080"                      # qBittorrent web UI (published here, not on qbittorrent)
      - "9696:9696"                      # Prowlarr web UI (published here, not on prowlarr)
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      # Allow the VPN namespace to reach this host's published ports: Prowlarr
      # must reach Sonarr/Radarr on the server stack (same machine).
      - FIREWALL_OUTBOUND_SUBNETS=${HOST_IP:-127.0.0.1}/32
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:?run churn first}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES:?run churn first}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-}
      - TZ=${TZ:-UTC}
    restart: unless-stopped

  # One-shot: seeds qBittorrent's config with a stable API key before it starts.
  qbittorrent-init:
    image: curlimages/curl:8.23.0
    container_name: qbittorrent-init
    user: "0:0"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config/qbittorrent:/config
      - ./scripts/qbittorrent-init.sh:/scripts/qbittorrent-init.sh:ro
    entrypoint: ["/bin/sh", "/scripts/qbittorrent-init.sh"]
    restart: "no"

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.3.0_v2.1.2-ls485
    container_name: qbittorrent
    network_mode: "service:gluetun"      # all traffic exits through the VPN; kill switch included
    depends_on:
      gluetun:
        condition: service_healthy       # gluetun's image ships a healthcheck
      qbittorrent-init:
        condition: service_completed_successfully
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      - "${DATA_DIR:?run churn to set DATA_DIR}:/data"
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.7.0.5723-ls166
    container_name: prowlarr
    network_mode: "service:gluetun"      # indexer traffic also exits through the VPN
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ./config/prowlarr:/config
      - "${DATA_DIR:?run churn to set DATA_DIR}:/data"
    restart: unless-stopped

  # One-shot: wires qBittorrent, public indexers, and Sonarr/Radarr.
  prowlarr-init:
    image: curlimages/curl:8.23.0
    container_name: prowlarr-init
    network_mode: "service:gluetun"      # localhost reaches Prowlarr and qBittorrent
    user: "0:0"
    environment:
      - HOST_IP=${HOST_IP:-}
      - PROWLARR_INDEXERS=${PROWLARR_INDEXERS:-eztv,yts,thepiratebay}
    depends_on:
      gluetun:
        condition: service_healthy
      qbittorrent-init:
        condition: service_completed_successfully
      qbittorrent:
        condition: service_started
      prowlarr:
        condition: service_started
    volumes:
      - ./config/prowlarr:/prowlarr-config:ro
      - ./config/qbittorrent:/qbittorrent-config:ro
      # Same-machine wiring: the server stack writes Sonarr/Radarr API keys here.
      - ../server/config/sonarr:/sonarr-config:ro
      - ../server/config/radarr:/radarr-config:ro
      - ./scripts/prowlarr-init.sh:/scripts/prowlarr-init.sh:ro
    entrypoint: ["/bin/sh", "/scripts/prowlarr-init.sh"]
    restart: "no"
