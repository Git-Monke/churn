# Mounted into every container that shares Gluetun's network namespace.
# Docker refuses `dns:` together with `network_mode: service:gluetun`, so the
# resolv.conf has to be supplied by a read-only bind mount instead.
# Gluetun runs its DNS-over-TLS resolver on 127.0.0.1 in this namespace.
nameserver 127.0.0.1
options edns0
